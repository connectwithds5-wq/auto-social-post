name: AI Content Strategy

on:
  workflow_dispatch:
  schedule:
    # Refresh before the daily generation windows.
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  strategy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai requests

      - name: Run AI strategy engine with YouTube Analytics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          GEMINI_MODEL: gemini-3.6-flash
        run: |
          python src/strategy_engine.py

      - name: Apply AI-selected posting times
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          python src/update_posting_schedule.py
          if ! git diff --quiet -- .github/workflows/generate.yml; then
            if [ -z "$WORKFLOW_PAT" ]; then
              echo "ERROR: WORKFLOW_PAT is required to update the Generate workflow schedule."
              exit 1
            fi
            git config user.name "AI Strategy Bot"
            git config user.email "actions@users.noreply.github.com"
            git add .github/workflows/generate.yml
            git commit -m "Update Auto Social posting schedule from analytics"
            git remote set-url origin "https://x-access-token:${WORKFLOW_PAT}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Posting schedule already matches AI strategy."
          fi

      - name: Commit strategy data
        run: |
          git config user.name "AI Strategy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add strategy.json strategy_history.json
          git diff --cached --quiet || git commit -m "Update AI content strategy"
          git push
