name: AI Content Strategy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  strategy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run AI strategy engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          GEMINI_MODEL: gemini-3.6-flash
        run: |
          python src/strategy_engine.py

      - name: Commit strategy data
        run: |
          git config user.name "AI Strategy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add strategy.json strategy_history.json
          git diff --cached --quiet || git commit -m "Update AI content strategy"
          git push
