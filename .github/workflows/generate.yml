name: Generate AI Quote Video

on:
  workflow_dispatch:

  schedule:
    - cron: "45 6 * * *"
    - cron: "35 11 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || secrets.YOUTUBE_CHANNEL_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    steps:

      # =====================================================
      # 1. CHECKOUT REPOSITORY
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. SETUP PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =====================================================
      # 3. INSTALL FFMPEG
      # =====================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # =====================================================
      # 4. INSTALL PYTHON DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =====================================================
      # 5. APPLY AI CONTENT STRATEGY
      # =====================================================

      - name: Apply AI Content Strategy
        run: |
          python src/strategy_injector.py


      # =====================================================
      # 6. GENERATE AI QUOTE + VIDEO
      #    PRIMARY + AUTOMATIC FALLBACK
      # =====================================================

      - name: Generate AI Quote Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Primary model
          GEMINI_MODEL: gemini-3.6-flash

          # Fallback model
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite

        run: |

          set +e

          echo ""
          echo "======================================"
          echo "      PRIMARY GEMINI MODEL"
          echo "======================================"
          echo "Model: gemini-3.6-flash"
          echo ""

          GEMINI_MODEL=gemini-3.6-flash \
          python src/generate_video.py

          PRIMARY_STATUS=$?


          # =================================================
          # PRIMARY SUCCESS
          # =================================================

          if [ "$PRIMARY_STATUS" -eq 0 ]; then

            echo ""
            echo "======================================"
            echo "   PRIMARY MODEL SUCCEEDED"
            echo "======================================"
            echo "Model: gemini-3.6-flash"
            echo "======================================"
            echo ""

            exit 0

          fi


          # =================================================
          # PRIMARY FAILED
          # =================================================

          echo ""
          echo "======================================"
          echo "   PRIMARY MODEL FAILED"
          echo "======================================"
          echo "Model: gemini-3.6-flash"
          echo ""
          echo "Trying fallback model..."
          echo "======================================"
          echo ""


          # =================================================
          # CLEAN PARTIAL OUTPUT
          # =================================================

          rm -f output/quote_reel.mp4
          rm -f output/metadata.json
          rm -rf output/frames


          # =================================================
          # FALLBACK MODEL
          # =================================================

          echo ""
          echo "======================================"
          echo "      FALLBACK GEMINI MODEL"
          echo "======================================"
          echo "Model: gemini-3.5-flash-lite"
          echo "======================================"
          echo ""

          GEMINI_MODEL=gemini-3.5-flash-lite \
          python src/generate_video.py

          FALLBACK_STATUS=$?


          # =================================================
          # FALLBACK SUCCESS
          # =================================================

          if [ "$FALLBACK_STATUS" -eq 0 ]; then

            echo ""
            echo "======================================"
            echo "   FALLBACK MODEL SUCCEEDED"
            echo "======================================"
            echo "Model: gemini-3.5-flash-lite"
            echo ""
            echo "Video generation can continue."
            echo "======================================"
            echo ""

            exit 0

          fi


          # =================================================
          # BOTH FAILED
          # =================================================

          echo ""
          echo "======================================"
          echo "    BOTH GEMINI MODELS FAILED"
          echo "======================================"
          echo ""
          echo "Primary:  gemini-3.6-flash"
          echo "Fallback: gemini-3.5-flash-lite"
          echo ""
          echo "Video generation failed."
          echo "======================================"
          echo ""

          exit "$FALLBACK_STATUS"


      # =====================================================
      # 7. ADD INSTRUMENTAL MUSIC
      # =====================================================

      - name: Add Instrumental Music
        run: |
          python src/add_music.py


      # =====================================================
      # 8. CHECK GENERATED FILES
      # =====================================================

      - name: Check generated files
        run: |

          echo "======================================"
          echo "          GENERATED FILES"
          echo "======================================"

          ls -lah output/

          echo ""
          echo "Video:"
          ls -lh output/quote_reel.mp4

          echo ""
          echo "Metadata:"
          ls -lh output/metadata.json


      # =====================================================
      # 9. UPLOAD VIDEO ARTIFACT
      # =====================================================

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-reel
          path: output/quote_reel.mp4
          retention-days: 7


      # =====================================================
      # 10. UPLOAD AI METADATA ARTIFACT
      # =====================================================

      - name: Upload AI metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-metadata
          path: output/metadata.json
          retention-days: 7


      # =====================================================
      # 11. UPLOAD VIDEO TO YOUTUBE
      # =====================================================

      - name: Upload to YouTube
        env:
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          YOUTUBE_PRIVACY_STATUS: public

        run: |
          python src/upload_youtube.py


      # =====================================================
      # 12. JOB SUMMARY
      # =====================================================

      - name: Job summary
        if: success()
        run: |

          echo "======================================"
          echo "      AI VIDEO PIPELINE SUCCESS"
          echo "======================================"
          echo ""
          echo "AI strategy applied."
          echo "AI video generated successfully."
          echo "Metadata generated successfully."
          echo "Artifact uploaded successfully."
          echo "YouTube upload completed successfully."
          echo ""
          echo "RISE MODE automation is LIVE!"
          echo "======================================"
