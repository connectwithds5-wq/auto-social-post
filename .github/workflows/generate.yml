name: Generate AI Quote Video

on:
  workflow_dispatch:
  schedule:
    - cron: "45 6 * * *"
    - cron: "45 11 * * *"

concurrency:
  group: auto-social-post-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || secrets.YOUTUBE_CHANNEL_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_WAN_SPACE: zerogpu-aoti/wan2-2-fp8da-aoti
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply AI Content Strategy
        run: python src/strategy_injector.py
      - name: Generate video — Wan 2.2 PRIMARY, existing renderer FALLBACK
        run: |
          set +e
          rm -rf output
          mkdir -p output
          echo "WAN 2.2 PRIMARY"
          python src/wan22_primary.py
          WAN_STATUS=$?
          if [ "$WAN_STATUS" -eq 0 ] && [ -s output/quote_reel.mp4 ]; then
            echo "WAN 2.2 PRIMARY SUCCEEDED"
            echo "VIDEO_MODEL=wan2.2" > output/model_used.env
            exit 0
          fi
          echo "WAN 2.2 FAILED — FALLING BACK TO EXISTING GEMINI/PIL/FFMPEG RENDERER"
          rm -rf output/wan22 output/quote_reel.mp4 output/metadata.json output/frames
          GEMINI_MODEL=gemini-3.6-flash python src/generate_video.py
          FALLBACK_STATUS=$?
          if [ "$FALLBACK_STATUS" -eq 0 ] && [ -s output/quote_reel.mp4 ]; then
            echo "EXISTING FALLBACK SUCCEEDED"
            echo "VIDEO_MODEL=gemini-pil-ffmpeg" > output/model_used.env
            exit 0
          fi
          exit "$FALLBACK_STATUS"
      - name: Add Instrumental Music
        run: python src/add_music.py
      - name: Validate generated files
        run: |
          test -s output/quote_reel.mp4
          test -s output/metadata.json
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/quote_reel.mp4
          cat output/model_used.env || true
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-reel
          path: output/quote_reel.mp4
          retention-days: 7
      - name: Upload AI metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-metadata
          path: output/metadata.json
          retention-days: 7
      - name: Upload model marker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-model-used
          path: output/model_used.env
          retention-days: 7
      - name: Upload to YouTube
        env:
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          YOUTUBE_PRIVACY_STATUS: public
        run: python src/upload_youtube.py
      - name: Job summary
        if: success()
        run: |
          echo "AI VIDEO PIPELINE SUCCESS"
          cat output/model_used.env
          echo "Wan 2.2 is primary; existing renderer is fallback."
