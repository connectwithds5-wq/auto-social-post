name: Generate AI Quote Video

on:
  workflow_dispatch:

  schedule:
    - cron: "30 6 * * *"
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || secrets.YOUTUBE_CHANNEL_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply AI Content Strategy
        run: python src/strategy_injector.py

      - name: Generate AI Quote Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
        run: |
          set +e
          GEMINI_MODEL=gemini-3.6-flash python src/generate_video.py
          PRIMARY_STATUS=$?
          if [ "$PRIMARY_STATUS" -eq 0 ]; then exit 0; fi
          rm -f output/quote_reel.mp4 output/metadata.json
          rm -rf output/frames
          GEMINI_MODEL=gemini-3.5-flash-lite python src/generate_video.py
          FALLBACK_STATUS=$?
          if [ "$FALLBACK_STATUS" -eq 0 ]; then exit 0; fi
          exit "$FALLBACK_STATUS"

      - name: Add Instrumental Music
        run: python src/add_music.py

      - name: Check generated files
        run: |
          ls -lah output/
          test -f output/quote_reel.mp4
          test -f output/metadata.json

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-reel
          path: output/quote_reel.mp4
          retention-days: 7

      - name: Upload AI metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-metadata
          path: output/metadata.json
          retention-days: 7

      - name: Upload to YouTube
        env:
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          YOUTUBE_PRIVACY_STATUS: public
        run: python src/upload_youtube.py

      - name: Job summary
        if: success()
        run: |
          echo "AI VIDEO PIPELINE SUCCESS"
          echo "AI strategy applied."
          echo "Video generated and uploaded to YouTube."
